name: qualitative-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "WORKFLOW.md"
      - "DESIGN.md"
      - "qualitative/**"
      - "scripts/invoke-qualitative-gate.ps1"
      - "scripts/test-qualitative-gate.ps1"
      - "scripts/validate-qualitative-result.ps1"
  push:
    branches: [main]
    paths:
      - "WORKFLOW.md"
      - "DESIGN.md"
      - "qualitative/**"
      - "scripts/invoke-qualitative-gate.ps1"
      - "scripts/test-qualitative-gate.ps1"
      - "scripts/validate-qualitative-result.ps1"

permissions:
  contents: read

concurrency:
  group: qualitative-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.LLM_GATE_ENABLED == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Run deterministic repository checks
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Require endpoint credentials
        shell: pwsh
        run: |
          $missing = @('LLM_API_KEY', 'LLM_BASE_URL') | Where-Object {
            [string]::IsNullOrWhiteSpace((Get-Item "Env:$_" -ErrorAction SilentlyContinue).Value)
          }
          if ($missing) {
            throw "Missing GitHub Actions repository secrets: $($missing -join ', ')"
          }
      - name: Run calibrated qualitative gate
        shell: pwsh
        run: ./scripts/invoke-quality-gates.ps1 -Profile qualitative
      - name: Upload qualitative evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualitative-gate-results
          path: |
            .reports/qualitative/*.json
            .reports/quality/qualitative.json
          if-no-files-found: warn
          retention-days: 14
