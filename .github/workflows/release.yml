name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release metadata
        shell: pwsh
        run: ./scripts/validate-release.ps1 -Tag '${{ github.ref_name }}'
      - name: Run release quality profile
        shell: pwsh
        run: ./scripts/invoke-quality-gates.ps1 -Profile release
      - name: Build release notes
        shell: pwsh
        run: ./scripts/get-release-notes.ps1
      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.ref_name }}
          path: |
            .reports/quality/release.json
            .reports/release-notes.md
          if-no-files-found: warn
          retention-days: 90
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' --verify-tag --title '${{ github.ref_name }}' --notes-file .reports/release-notes.md '.reports/quality/release.json#quality-report.json'
