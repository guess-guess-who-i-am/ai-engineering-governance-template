name: docs-site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'design/catalog.json'
      - 'scripts/build-docs-site.ps1'
      - 'scripts/test-docs-site.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'design/catalog.json'
      - 'scripts/build-docs-site.ps1'
      - 'scripts/test-docs-site.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-site.yml'

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Install Chromium
        shell: pwsh
        run: npx playwright install chromium
      - name: Build and test site
        shell: pwsh
        run: |
          ./scripts/build-docs-site.ps1
          ./scripts/test-docs-site.ps1 -SitePath .reports/site-dist
          npm run test:site
      - name: Upload visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site-${{ github.sha }}
          path: |
            .reports/site/*.png
            .reports/site-dist/**
          if-no-files-found: error
          retention-days: 14
