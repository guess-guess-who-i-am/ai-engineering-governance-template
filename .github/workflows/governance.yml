name: governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-profile-windows-bindings:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Test platform-only bindings and original policies
        shell: pwsh
        run: |
          node scripts/test-mac-windows-bindings.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-mac-windows-hook-command.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-hook-cadence-mac.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-codex-latency.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-codex-retest-diagnostics.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-web-search-evidence.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-methodology-target-ownership.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node codex-profile/.codex/prompt-publisher/test-methodology-publisher.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-parallel-run.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-routing-fusion.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-parallel-stdin.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-worker-startup-race.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install bounded research-tool dependencies
        run: npm ci --ignore-scripts
      - name: Test batched technical research and MCP boundary
        shell: pwsh
        run: |
          node scripts/test-technical-research.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-technical-research-mcp.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  portable-profile-macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Test macOS global Codex profile
        run: ./scripts/test-codex-profile-mac.sh
      - name: Test pinned Skill library restore on a clean home
        run: node scripts/test-global-skill-library.mjs
      - name: Test real GraphToolCall worker and candidate pool
        run: |
          python3 -m venv .tools/graph-worker-tests
          .tools/graph-worker-tests/bin/python -m pip install 'graph-tool-call==0.46.0' 'numpy>=1.24,<3'
          .tools/graph-worker-tests/bin/python scripts/test-graph-worker.py
          CODEX_INDEXER_SOURCE=codex-profile/mac/hooks/graph_skill_index.py .tools/graph-worker-tests/bin/python scripts/test-description-vector-cache.py

  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Run PR quality profile
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Upload quality evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-quality-${{ github.sha }}
          path: .reports/quality/pr.json
          if-no-files-found: error
          retention-days: 14
