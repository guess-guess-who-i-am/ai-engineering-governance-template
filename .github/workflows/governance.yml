name: governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-profile-macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned Node dependencies
        run: npm ci --ignore-scripts
      - name: Test macOS global Codex profile
        run: |
          ./scripts/test-codex-profile-mac.sh
          node scripts/test-global-graph-service.mjs
      - name: Test shared search service, limits and MCP recovery
        run: |
          npm run test:research-search
      - name: Test conversational routing and IDE patch contract
        run: |
          node --test scripts/test-routing-context.mjs
          node scripts/test-desktop-skill-routing.mjs
          node scripts/test-routing-worker-errors.mjs
          python3 scripts/test-patch-ide-routing-context.py
      - name: Test pinned Skill library restore on a clean home
        run: node scripts/test-global-skill-library.mjs
      - name: Test real GraphToolCall worker and candidate pool
        run: |
          python3 -m venv .tools/graph-worker-tests
          .tools/graph-worker-tests/bin/python -m pip install 'graph-tool-call[embedding]==0.46.0' 'sentence-transformers==6.1.0' 'httpx==0.28.1'
          .tools/graph-worker-tests/bin/python -c "from sentence_transformers import SentenceTransformer; [SentenceTransformer(name, device='cpu') for name in ['sentence-transformers/all-MiniLM-L6-v2', 'paraphrase-multilingual-MiniLM-L12-v2']]"
          .tools/graph-worker-tests/bin/python scripts/test-graph-worker.py
          .tools/graph-worker-tests/bin/python scripts/test-description-cache.py
          .tools/graph-worker-tests/bin/python scripts/test-bm25-score-cache.py
          .tools/graph-worker-tests/bin/python scripts/test-worker-cpu-model.py
          .tools/graph-worker-tests/bin/python scripts/test-complete-window-cache.py
          .tools/graph-worker-tests/bin/python scripts/test-graph-load-inputs.py
          .tools/graph-worker-tests/bin/python scripts/test-artifact-relations.py
          .tools/graph-worker-tests/bin/python scripts/test-semantic-relations.py
          node --test scripts/test-publish-resource-graph.mjs scripts/test-install-portable-resources.mjs

  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Run PR quality profile
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Upload quality evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-quality-${{ github.sha }}
          path: .reports/quality/pr.json
          if-no-files-found: error
          retention-days: 14
