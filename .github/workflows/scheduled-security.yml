name: scheduled-security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Run nightly quality profile
        shell: pwsh
        run: ./scripts/invoke-quality-gates.ps1 -Profile nightly
      - name: Upload security evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-security-${{ github.sha }}
          path: .reports/quality/nightly.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload dependency and upstream evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-supply-chain-${{ github.sha }}
          path: |
            .reports/upstream-drift.json
            package-lock.json
          if-no-files-found: error
          retention-days: 30
