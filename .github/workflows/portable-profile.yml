name: portable-profile

on:
  pull_request:
  push:
    branches: [main, codex/macos-global-deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-profile:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Global files, publisher, native paths and preservation
        run: node scripts/test-portable-profile.mjs
      - name: Restore pinned Skill library from a clean home
        run: node scripts/test-global-skill-library.mjs
      - name: Hook cadence and DAG scheduling
        run: |
          node scripts/test-hook-cadence-mac.mjs
          node scripts/test-parallel-run.mjs
      - name: Install real GraphToolCall for IPC evidence
        run: python -m pip install graph-tool-call==0.46.0
      - name: Real process pool, prefilter, authentication and single-instance lock
        run: python scripts/test-graph-worker-portable.py
      - name: Windows scheduled task and ACL
        if: runner.os == 'Windows'
        run: node scripts/test-windows-profile-service.mjs
      - name: Governance and secret checks
        shell: pwsh
        run: |
          ./scripts/validate-governance.ps1
          ./scripts/validate-skills.ps1
          ./scripts/validate-workflows.ps1
          ./scripts/scan-secrets.ps1
